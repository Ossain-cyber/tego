<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tego Chats</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="chats.js"></script>
</head>
<body>

<div class="app">

<header class="topbar">

<div class="topbar-title">
Chats
</div>

<div class="topbar-actions">

<button
type="button"
onclick="openContacts()"
class="icon-btn"
>
Contacts
</button>

<button
type="button"
onclick="openProfile()"
class="icon-btn"
>
Profile
</button>

</div>

</header>

<div class="search-wrap">

<input
type="text"
id="chat-search"
placeholder="Search chats"
autocomplete="off"
>

</div>

<div
id="chat-list"
class="chat-list"
>

<div class="empty-state">
Loading chats...
</div>

</div>

<nav class="bottom-nav">

<button
onclick="openChats()"
class="nav-btn active"
>
Chats
</button>

<button
onclick="openContacts()"
class="nav-btn"
>
Contacts
</button>

<button
onclick="openProfile()"
class="nav-btn"
>
Profile
</button>

<button
onclick="openSettings()"
class="nav-btn"
>
Settings
</button>

</nav>

</div>

<script>

document.addEventListener(
"DOMContentLoaded",
async () => {

if (
typeof initChatsPage ===
"function"
) {

await initChatsPage();

}

}
);

</script>

</body>
</html>
