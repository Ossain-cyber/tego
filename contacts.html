<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tego Contacts</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="contacts.js"></script>
</head>
<body>

<div class="app">

<header class="topbar">

<div class="topbar-title">
Contacts
</div>

<div class="topbar-actions">

<button
type="button"
onclick="openChats()"
class="icon-btn"
>
Chats
</button>

</div>

</header>

<div class="container">

<div class="card">

<input
type="text"
id="search-input"
placeholder="Search username or Tego ID"
autocomplete="off"
>

<button
id="search-btn"
class="btn"
>
Search
</button>

</div>

<div
id="search-results"
class="results-list"
>
</div>

<div
id="contacts-list"
class="contacts-list"
>

<div class="empty-state">
Loading contacts...
</div>

</div>

</div>

<nav class="bottom-nav">

<button
onclick="openChats()"
class="nav-btn"
>
Chats
</button>

<button
onclick="openContacts()"
class="nav-btn active"
>
Contacts
</button>

<button
onclick="openProfile()"
class="nav-btn"
>
Profile
</button>

<button
onclick="openSettings()"
class="nav-btn"
>
Settings
</button>

</nav>

</div>

<script>

document.addEventListener(
"DOMContentLoaded",
async () => {

if (
typeof initContactsPage ===
"function"
) {

await initContactsPage();

}

}
);

</script>

</body>
</html>
