<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Create Account - Tego</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
</head>
<body>

<div class="auth-page">

<div class="auth-card">

<div class="logo-box">
<img src="icon-192.png" alt="Tego">
</div>

<h1 class="app-title">Create Account</h1>

<p class="app-subtitle">
Join Tego
</p>

<form id="register-form">

<div class="input-group">
<input
class="input"
type="email"
id="email"
placeholder="Email"
required
>
</div>

<div class="input-group">
<input
class="input"
type="password"
id="password"
placeholder="Password"
minlength="6"
required
>
</div>

<div class="input-group">
<input
class="input"
type="password"
id="confirm-password"
placeholder="Confirm Password"
required
>
</div>

<button
type="submit"
class="btn"
id="register-btn"
>
Create Account
</button>

</form>

<a
href="login.html"
class="link"
>
Already have an account?
</a>

</div>

</div>

<script>

document.addEventListener(
"DOMContentLoaded",
() => {

const form =
document.getElementById(
"register-form"
);

const button =
document.getElementById(
"register-btn"
);

form.addEventListener(
"submit",
async e => {

e.preventDefault();

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const confirmPassword =
document
.getElementById("confirm-password")
.value;

if(
!email ||
!password ||
!confirmPassword
){
showToast(
"Fill all fields"
);
return;
}

if(
password !==
confirmPassword
){
showToast(
"Passwords do not match"
);
return;
}

if(
password.length < 6
){
showToast(
"Password too short"
);
return;
}

try{

button.disabled = true;

button.textContent =
"Creating...";

await signUp(
email,
password
);

showToast(
"Account created"
);

setTimeout(() => {

window.location.href =
"profile.html";

},700);

}catch(error){

showToast(
error.message ||
"Registration failed"
);

button.disabled = false;

button.textContent =
"Create Account";

}

});

});
</script>

</body>
</html>
