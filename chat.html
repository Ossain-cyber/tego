<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tego Chat</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="chat.js"></script>
</head>
<body>

<div class="chat-page">

<header class="chat-header">

<button
type="button"
class="back-btn"
onclick="window.location.href='chats.html'"
>
←
</button>

<div class="chat-user">

<img
id="chat-avatar"
class="chat-avatar"
src="icon-192.png"
alt="Avatar"
>

<div class="chat-meta">

<div
id="chat-name"
class="chat-name"
>
Loading...
</div>

<div
id="chat-status"
class="chat-status"
>
Last seen recently
</div>

</div>

</div>

</header>

<main
id="messages"
class="messages"
>

<div
id="empty-state"
class="empty-state"
>
No messages yet
</div>

</main>

<div
id="reply-preview"
class="reply-preview hidden"
>

<div
id="reply-text"
class="reply-text"
>
</div>

<button
type="button"
id="cancel-reply"
class="reply-close"
>
✕
</button>

</div>

<div class="chat-composer">

<input
type="file"
id="media-input"
hidden
>

<button
type="button"
id="media-btn"
class="composer-btn"
title="Attach"
>
📎
</button>

<input
type="text"
id="message-input"
placeholder="Type a message"
autocomplete="off"
>

<button
type="button"
id="record-btn"
class="composer-btn"
title="Voice Note"
>
🎤
</button>

<button
type="button"
id="send-btn"
class="send-btn"
title="Send"
>
➤
</button>

</div>

</div>

<script>

document.addEventListener(
"DOMContentLoaded",
async () => {

if (
typeof initChatPage ===
"function"
) {

await initChatPage();

}

}
);

</script>

</body>
</html>
