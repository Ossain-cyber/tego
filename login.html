<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Tego Login</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo-box">
            <img src="icon-192.png" alt="Tego">
        </div>

        <h1 class="app-title">Tego</h1>

        <p class="app-subtitle">
            Welcome back
        </p>

        <form id="login-form">

            <div class="input-group">
                <input
                    class="input"
                    type="email"
                    id="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    class="input"
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn"
                id="login-btn"
            >
                Login
            </button>

        </form>

        <a href="register.html" class="link">
            Create Account
        </a>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const form = document.getElementById("login-form");
    const button = document.getElementById("login-btn");

    if (!form || !button) return;

    form.addEventListener("submit", async (e) => {

        e.preventDefault();

        if (button.disabled) return;

        const email = document
            .getElementById("email")
            .value
            .trim();

        const password = document
            .getElementById("password")
            .value;

        if (!email || !password) {
            alert("Please fill in all fields.");
            return;
        }

        button.disabled = true;
        button.textContent = "Signing In...";

        try {

            if (!window.APP || !window.APP.supabase) {
                throw new Error("Tego could not connect to Supabase. Please refresh the page.");
            }

            const { data, error } =
                await window.APP.supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                throw error;
            }

            if (!data || !data.session || !data.user) {
                throw new Error("Login succeeded but no session was created.");
            }

            window.APP.user = data.user;
            window.APP.session = data.session;

            localStorage.setItem(
                "tego_logged_in",
                "true"
            );

            window.location.replace("chats.html");

        } catch (error) {

            console.error(error);

            alert(
                error && error.message
                    ? error.message
                    : "Login failed. Please try again."
            );

            button.disabled = false;
            button.textContent = "Login";
        }

    });

});
</script>

</body>
</html>
