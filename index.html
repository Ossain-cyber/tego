<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tego</title>
</head>
<body>
  <h1>Tego Login</h1>
  <p id="status">Loading...</p>
  
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="login-btn">Login</button>
  <p id="result"></p>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.getElementById('status').textContent = 'Script running';
    
    const supabase = window.supabase.createClient(
      'https://wepbechfempjhabhzbyk.supabase.co',
      'YOUR_ANON_KEY_HERE'
    );
    
    document.getElementById('status').textContent = 'Supabase ready';
    
    document.getElementById('login-btn').addEventListener('click', async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const result = document.getElementById('result');
      
      result.textContent = 'Attempting login...';
      
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });
      
      if (error) {
        result.textContent = 'Error: ' + error.message;
        result.style.color = 'red';
      } else {
        result.textContent = 'Success! User: ' + data.user.email;
        result.style.color = 'green';
      }
    });
  </script>
</body>
</html>
