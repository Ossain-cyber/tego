<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Tego</title>

<link rel="manifest" href="manifest.json">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,system-ui,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:#0f172a;
display:flex;
align-items:center;
justify-content:center;
}

.bg{
position:fixed;
inset:0;
overflow:hidden;
}

.blob{
position:absolute;
border-radius:50%;
filter:blur(80px);
animation:float 10s infinite ease-in-out;
}

.blob:nth-child(1){
width:260px;
height:260px;
background:#2563eb;
top:-50px;
left:-60px;
}

.blob:nth-child(2){
width:220px;
height:220px;
background:#3b82f6;
bottom:-50px;
right:-50px;
animation-delay:2s;
}

.blob:nth-child(3){
width:180px;
height:180px;
background:#64748b;
top:40%;
left:50%;
transform:translate(-50%,-50%);
animation-delay:4s;
}

@keyframes float{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-25px);
}
}

.splash{
position:relative;
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:20px;
}

.logo{
width:110px;
height:110px;
border-radius:32px;
background:linear-gradient(135deg,#2563eb,#60a5fa);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 0 40px rgba(37,99,235,.5);
animation:pulse 2s infinite;
}

.logo img{
width:70px;
height:70px;
object-fit:contain;
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.05);
}
}

h1{
color:#fff;
font-size:42px;
font-weight:800;
letter-spacing:-1px;
}

p{
color:#94a3b8;
font-size:14px;
}

.loader{
width:40px;
height:40px;
border:4px solid rgba(255,255,255,.1);
border-top:4px solid #3b82f6;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}
</style>
</head>
<body>

<div class="bg">
<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>
</div>

<div class="splash">

<div class="logo">
<img src="icon-192.png" alt="Tego">
</div>
