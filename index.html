<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Tego</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app">

<section id="authScreen" class="screen active">
<div class="brand">
<div class="logo">T</div>
<h1>Tego</h1>
<p>Private messaging made simple</p>
</div>

<div class="card">

<div class="tabs">
<button id="loginTab" class="tab active">Login</button>
<button id="signupTab" class="tab">Sign Up</button>
</div>

<form id="loginForm" class="form">
<input
type="email"
id="loginEmail"
placeholder="Email"
required
>

<input
type="password"
id="loginPassword"
placeholder="Password"
required
>

<button type="submit" class="primaryBtn">
Login
</button>
</form>

<form id="signupForm" class="form hidden">

<input
type="text"
id="displayName"
placeholder="Display Name"
required
>

<input
type="text"
id="username"
placeholder="Username"
required
>

<input
type="email"
id="signupEmail"
placeholder="Email"
required
>

<input
type="password"
id="signupPassword"
placeholder="Password"
required
>

<button type="submit" class="primaryBtn">
Create Account
</button>

</form>

</div>
</section>

<section id="mainScreen" class="screen">

<header class="topBar">
<div class="topLeft">
<div id="avatarCircle">T</div>

<div>
<h2>Tego</h2>
<p id="currentUsername">@user</p>
</div>
</div>

<div class="topActions">
<button id="openProfileBtn">Profile</button>
</div>
</header>

<nav class="bottomTabs">

<button
class="navBtn active"
data-screen="chatListScreen">
Chats
</button>

<button
class="navBtn"
data-screen="contactsScreen">
Contacts
</button>

<button
class="navBtn"
data-screen="profileScreen">
Profile
</button>

</nav>

<div class="content">

<section
id="chatListScreen"
class="view active">

<div class="searchWrap">
<input
type="text"
id="chatSearch"
placeholder="Search chats">
</div>

<div id="chatList">

<div
class="chatItem saved"
data-chat="saved">

<div class="chatAvatar">
S
</div>

<div class="chatBody">
<h4>Saved Messages</h4>
<p>Notes and reminders</p>
</div>

</div>

</div>

</section>

<section
id="contactsScreen"
class="view">

<div class="card">

<h3>Add Contact</h3>

<input
type="text"
id="contactSearch"
placeholder="@username or TEGO-ID">

<button
id="findContactBtn"
class="primaryBtn">
Find User
</button>

</div>

<div id="contactResults"></div>

<div id="contactsList"></div>

</section>

<section
id="profileScreen"
class="view">

<div class="profileBox">

<label
for="avatarInput"
class="profileAvatar">

<img
id="avatarPreview"
alt="avatar">

<span id="avatarFallback">
T
</span>

</label>

<input
type="file"
id="avatarInput"
accept="image/*">

<h2 id="profileName">
Tego User
</h2>

<p id="profileUsername">
@username
</p>

<div class="idCard">

<span>Tego ID</span>

<strong id="profileTegoId">
Loading...
</strong>

</div>

<button
id="copyTegoBtn"
class="primaryBtn">
Copy Tego ID
</button>

</div>

</section>

<section
id="chatScreen"
class="view">

<div class="chatHeader">

<button id="backBtn">
←
</button>

<div>

<h3 id="chatTitle">
Saved Messages
</h3>

<p id="chatStatus">
online
</p>

</div>

</div>

<div id="messagesContainer"></div>

<form id="messageForm">

<input
type="text"
id="messageInput"
placeholder="Message">

<button type="submit">
Send
</button>

</form>

</section>

</div>

</section>

</div>
