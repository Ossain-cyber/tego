<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tego Settings</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="settings.js"></script>
</head>
<body>

<div class="app">

<header class="topbar">

<div class="topbar-title">
Settings
</div>

</header>

<div class="container">

<div class="card profile-card">

<img
id="avatar"
src="icon-192.png"
class="avatar-xl"
alt="Avatar"
>

<h2 id="display-name">
Loading...
</h2>

<p id="username">
@username
</p>

<div
id="tego-id"
class="readonly-box"
>
TEGO-ID
</div>

</div>

<div class="card">

<button
id="edit-profile"
class="btn"
>
Edit Profile
</button>

<button
id="install-app"
class="btn hidden"
>
Install App
</button>

<button
id="clear-cache"
class="btn"
>
Clear Cache
</button>

<button
id="logout-btn"
class="btn danger"
>
Logout
</button>

</div>

<div class="card">

<h3>
About Tego
</h3>

<p>
Fast messaging powered by Supabase realtime.
</p>

</div>

</div>

<nav class="bottom-nav">

<button
onclick="openChats()"
class="nav-btn"
>
Chats
</button>

<button
onclick="openContacts()"
class="nav-btn"
>
Contacts
</button>

<button
onclick="openProfile()"
class="nav-btn"
>
Profile
</button>

<button
onclick="openSettings()"
class="nav-btn active"
>
Settings
</button>

</nav>

</div>

<script>
document.addEventListener(
"DOMContentLoaded",
async () => {

if (
typeof initSettingsPage ===
"function"
) {

await initSettingsPage();

}

}
);
</script>

</body>
</html>
