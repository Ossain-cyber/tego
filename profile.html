<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tego Profile</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="profile.js"></script>
</head>
<body>

<div class="page">

    <div class="topbar">
        <div class="topbar-title">
            Profile
        </div>
    </div>

    <div class="container">

        <div class="card">

            <div class="center" style="flex-direction:column;">

                <img
                id="avatar-preview"
                src="icon-192.png"
                alt="Avatar"
                >

                <input
                type="file"
                id="avatar"
                accept="image/*"
                >

            </div>

        </div>

        <div class="card">

            <div class="input-group">
                <label for="display-name">
                    Display Name
                </label>

                <input
                type="text"
                id="display-name"
                class="input"
                placeholder="Your name"
                maxlength="40"
                >
            </div>

            <div class="input-group">
                <label for="username">
                    Username
                </label>

                <input
                type="text"
                id="username"
                class="input"
                placeholder="username"
                maxlength="20"
                >
            </div>

            <div class="input-group">
                <label for="bio">
                    Bio
                </label>

                <textarea
                id="bio"
                class="textarea"
                placeholder="Tell people about yourself"
                maxlength="160"
                rows="4"
                ></textarea>
            </div>

            <div class="input-group">

                <label>
                    Tego ID
                </label>

                <div
                id="tego-id"
                class="card"
                style="
                margin-top:8px;
                padding:14px;
                text-align:center;
                font-weight:700;
                "
                >
                    Generating...
                </div>

            </div>

            <button
            id="save-profile"
            class="btn mt-20"
            >
                Continue
            </button>

        </div>

    </div>

</div>

<script>
document.addEventListener(
    "DOMContentLoaded",
    async () => {

        await initProfilePage();

    }
);
</script>

</body>
</html>
