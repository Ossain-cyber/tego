<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tego Profile</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="profile.js"></script>
</head>
<body>

<div class="page">

    <div class="topbar">
        <div class="topbar-title">
            Profile
        </div>
    </div>

    <div class="container">

        <div class="card">

            <div class="center" style="flex-direction:column;">

                <img
                id="avatar-preview"
                src="icon-192.png"
                alt="User profile avatar"
                width="150"
                height="150"
                style="border-radius:50%;object-fit:cover;"
                >

                <input
                type="file"
                id="avatar"
                accept="image/*"
                aria-label="Upload avatar image"
                style="margin-top:12px;"
                >

            </div>

        </div>

        <div class="card">

            <div class="input-group">
                <label for="display-name">
                    Display Name
                </label>

                <input
                type="text"
                id="display-name"
                class="input"
                placeholder="Your name"
                maxlength="40"
                required
                aria-required="true"
                >
            </div>

            <div class="input-group">
                <label for="username">
                    Username
                </label>

                <input
                type="text"
                id="username"
                class="input"
                placeholder="username"
                maxlength="20"
                required
                aria-required="true"
                pattern="[a-zA-Z0-9_]+"
                title="Username can only contain letters, numbers, and underscores"
                >
            </div>

            <div class="input-group">
                <label for="bio">
                    Bio
                </label>

                <textarea
                id="bio"
                class="textarea"
                placeholder="Tell people about yourself"
                maxlength="160"
                rows="4"
                aria-describedby="bio-char-count"
                ></textarea>
                <small id="bio-char-count" style="display:block;text-align:right;color:#666;margin-top:4px;">
                    0 / 160 characters
                </small>
            </div>

            <div class="input-group">

                <label>
                    Tego ID
                </label>

                <div
                id="tego-id"
                class="card"
                style="
                margin-top:8px;
                padding:14px;
                text-align:center;
                font-weight:700;
                background:#f5f5f5;
                word-break:break-all;
                "
                >
                    Generating...
                </div>
                <button
                id="copy-tego-id"
                class="btn mt-20"
                type="button"
                aria-label="Copy Tego ID to clipboard"
                >
                    Copy Tego ID
                </button>

                <div id="copy-feedback" style="display:none;color:#4CAF50;margin-top:8px;text-align:center;">
                    ✓ Copied to clipboard!
                </div>

            </div>

            <div id="save-status" style="margin-top:12px;"></div>

            <button
            id="save-profile"
            class="btn mt-20"
            type="button"
            >
                Save Profile
            </button>

            <div id="loading-indicator" style="display:none;margin-top:12px;text-align:center;color:#666;">
                Saving...
            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener(
    "DOMContentLoaded",
    async () => {

        try {
            await initProfilePage();
        } catch (error) {
            console.error('Failed to initialize profile:', error);
            const statusEl = document.getElementById('save-status');
            if (statusEl) {
                statusEl.innerHTML = '<div style="color:red;padding:12px;background:#ffebee;border-radius:4px;">Failed to load profile. Please refresh the page.</div>';
            }
        }

    }
);
</script>

</body>
</html>
