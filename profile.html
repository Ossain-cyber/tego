<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tego Profile</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="profile.js"></script>
</head>
<body>

<div class="page">

<div class="topbar">
<div class="topbar-title">
Profile
</div>
</div>

<div class="container">

<div class="card">

<div class="profile-center">

<img
id="avatar-preview"
src="icon-192.png"
class="avatar-xl"
alt="Avatar"
>

<input
type="file"
id="avatar"
accept="image/*"
>

</div>

</div>

<div class="card">

<label>
Display Name
</label>

<input
type="text"
id="display-name"
placeholder="Your name"
maxlength="40"
>

<label>
Username
</label>

<input
type="text"
id="username"
placeholder="username"
maxlength="20"
>

<label>
Bio
</label>

<textarea
id="bio"
placeholder="Tell people about yourself"
maxlength="160"
rows="4"
></textarea>

<label>
Tego ID
</label>

<div
id="tego-id"
class="readonly-box"
>
Generating...
</div>

<button
id="save-profile"
class="btn"
>
Continue
</button>

</div>

</div>

</div>

<script>
document.addEventListener(
"DOMContentLoaded",
async () => {

await initProfilePage();

}
);
</script>

</body>
</html>
